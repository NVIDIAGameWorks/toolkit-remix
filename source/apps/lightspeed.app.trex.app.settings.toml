[app]
# Required to avoid a myriad of issues: Slow to close, crash on exit, wrong exit code...
fastShutdown = true
# Kit 110 sets useFabricSceneDelegate=true in kit-core.json. RTX Remix uses HdRemixRendererPlugin
# and does not use UsdRt/Fabric. Override to suppress the IUtils initialization error.
useFabricSceneDelegate = false
enableDeveloperWarnings = false

[app.audio]
enabled = false  # OM-105157

[app.content]
emptyStageOnStart = true

[app.extensions]
registryEnabled = true

[exts."omni.services.transport.server.http"]
# Let the Kit HTTP service auto-select a free port in its allowed range when the default
# port is already occupied. This prevents startup from aborting with SystemExit during launch.
port = 0

[exts."omni.flux.telemetry.core".sentry_event_filter]
enabled = true
owned_module_prefixes = ["omni.flux", "lightspeed"]
external_exception_module_prefixes = ["pxr"]
drop_unattributed_events = true

# Fonts
[app.font]
file = "${lightspeed.trex.app.resources}/data/fonts/NVIDIASans_A_Rg.ttf"
size = 16

[app.file]
# ignore omni.kit.windows.file handling so we can have our own (trexIgnoreUnsavedOnExit)
ignoreUnsavedStage = true  # skips initial save prompt
ignoreUnsavedOnExit = true  # skips omni.kit.windows.file handling

[app.menu]
legacy_mode = false
compatibility_mode=false

[app.exts]
folders.'++' = ["${app}/../exts", "${app}/../extscache", "${app}/../apps"]

[app.viewport]
grid.trackCamera = true

[app.window]
width = 1800
height = 900
x = -1
y = -1

[app.renderer]
skipWhileMinimized = true

[app.runLoops.present]
rateLimitFrequency = 60

# Basic Kit App
################################
[persistent.app.window]
uiStyle = "NvidiaDark"

# Viewport
###############################
[persistent.app.viewport]
# pickingMode = "models"
pickingMode = "prims"
noPadding = true
ui.background.opacity = 0.7
ui.background.brightness = 0.9
