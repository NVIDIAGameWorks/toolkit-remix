[package]
kit_sdk_version = "110.*"
version = "1.17.3"
authors =["Damien Bataille <dbataille@nvidia.com>"]
title = "NVIDIA RTX Remix Properties Pane Asset Replacements widget for the StageCraft"
description = "Asset Replacements Properties Pane widget for NVIDIA RTX Remix StageCraft App"
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
keywords = ["properties", "pane", "asset", "replacement", "widget"]
icon = "data/icon.png"
category = "internal"
preview_image = "data/preview.png"
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/-/tree/main/source/extensions/lightspeed.trex.properties_pane.shared.asset_replacements.widget"

[dependencies]
"lightspeed.layer_manager.core" = {}
"lightspeed.trex.material.core.shared" = {}
"lightspeed.trex.logic.core" = {}
"lightspeed.trex.properties_pane.material.widget" = {}
"lightspeed.trex.properties_pane.mesh.widget" = {}
"lightspeed.trex.properties_pane.particle.widget" = {}
"lightspeed.trex.properties_pane.logic.widget" = {}
"lightspeed.trex.property_transfer.widget" = {}
"lightspeed.trex.replacement.core.shared" = {}
"lightspeed.trex.selection_tree.widget" = {}
"lightspeed.trex.utils.common" = {}
"lightspeed.trex.utils.widget" = {}
"lightspeed.trex.viewports.shared.widget" = {}
"lightspeed.common" = {}
"omni.flux.bookmark_tree.model.usd" = {}
"omni.flux.bookmark_tree.widget" = {}
"omni.flux.selection_history_tree.widget" = {}
"omni.flux.selection_history_tree.model.usd" = {}
"omni.flux.layer_tree.usd.widget" = {}
"omni.flux.utils.common" = {}
"omni.flux.utils.widget" = {}
"omni.ui" = {}
"omni.usd" = {}
"omni.client" = {}
"omni.kit.menu.utils" = {}

[[python.module]]
name = "lightspeed.trex.properties_pane.widget"

[[test]]
dependencies = [
    "lightspeed.trex.tests.dependencies",
    "omni.kit.test_suite.helpers",
    "lightspeed.event.load_edit_target"
]

args = [
    "--/renderer/mdl/searchPaths/templates=${lightspeed.trex.app.resources}/deps/omni_core_materials/Base;${kit}/mdl/core/Base;${kit}/mdl/core/Volume;${kit}/mdl/core/mdl"
]

stdoutFailPatterns.exclude = [
    "*Unsupported image file format, use the RTX-Remix toolkit and ingest the following asset: *T_MetalPanelWall_HeavyRust_*.png",
    "*[omni.kit.scene_view.opengl] No UsdRender.Product was found at *",
    "*[omni.rtx] OpenGL error after call of glTextureStorageMem2DEXT(texture.tex, 1, glFormat, desc->width, desc->height, texture.mem, desc->offset), 1281 - 'A numeric argument is out of range.'*",
    "*[omni.rtx] createGLInteropTexture() failed, Cannot import glTexture.*",
    "*[omni.kit.widget.opengl.plugin] GLRenderTexture::addDepthTargets: Could not get OpenGL interop depth texture for RpResource[0]*",
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = [
    "lightspeed.trex.tests.dependencies",
]
