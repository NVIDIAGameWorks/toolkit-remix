[package]
kit_sdk_version = "110.*"
version = "1.0.0"
authors = ["Pierre-Olivier Trottier <ptrottier@nvidia.com>"]
title = "NVIDIA RTX Remix Asset Modifiers Factory"
description = "A factory that registers RTX Remix asset modifier plugins"
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
category = "internal"
keywords = ["asset", "modifier", "factory", "remix"]
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/"

[dependencies]
"lightspeed.trex.asset_pipeline.core" = {}
"omni.flux.factory.base" = {}
"omni.flux.job_queue.core" = {}
"omni.flux.utils.common" = {}
"omni.usd" = {}

[[python.module]]
name = "lightspeed.trex.asset_modifiers.factory"

[[test]]
dependencies = ["lightspeed.trex.tests.dependencies"]

stdoutFailPatterns.exclude = [
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = ["lightspeed.trex.tests.dependencies"]
