[package]
kit_sdk_version = "110.*"
title = "Extension example to create the core"
description = "This is an event for setting the camera light"
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
version = "1.1.5"
authors = [ "Shona Gillard <sgillard@nvidia.com>",]
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/-/tree/main/source/extensions/lightspeed.event.camera_light"
category = "internal"
keywords = [ "remix", "event"]
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"lightspeed.events_manager" = {}
"omni.flux.utils.common" = {}
"omni.usd" = {}
# The app bundle enables the renderer extension in production. Keep this optional
# so isolated camera-light tests can patch the local HdRemix wrappers without
# starting the renderer and its transitive viewport/schema stack.
"lightspeed.hydra.remix.core" = { optional = true }

[[python.module]]
name = "lightspeed.event.camera_light"

[[test]]
dependencies = [
    "lightspeed.trex.tests.dependencies",
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = [
    "lightspeed.trex.tests.dependencies",
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]
