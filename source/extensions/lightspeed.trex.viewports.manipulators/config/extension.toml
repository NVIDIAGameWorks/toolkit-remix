[package]
kit_sdk_version = "110.*"
version = "1.7.1"
authors = ["dbataille@nvidia.com"]
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit"
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
keywords = ["remix", "viewport", "manipulators"]
title = "NVIDIA RTX Remix Viewports implementation for the StageCraft"
description = "Viewports implementation for NVIDIA RTX Remix StageCraft App"
icon = "data/icon.png"
category = "internal"
preview_image = "data/preview.png"

[dependencies]
"lightspeed.common" = {}
"lightspeed.trex.asset_replacements.core.shared" = {}
"lightspeed.trex.contexts" = {}
"lightspeed.trex.utils.common" = {}
"lightspeed.hydra.remix.core" = {}
"omni.kit.manipulator.camera" = {}
"omni.kit.manipulator.prim" = {}
"omni.kit.manipulator.selection" = {}
"omni.kit.widget.viewport" = {}
"omni.flux.utils.common" = {}
"omni.ui" = {}
"omni.usd" = {}

[[python.module]]
name = "lightspeed.trex.viewports.manipulators"

[[test]]
dependencies = [
    "lightspeed.trex.tests.dependencies",
    "lightspeed.trex.control.stagecraft",
    "lightspeed.trex.viewports.stagecraft.bundle",  # viewport registry/menu baseline used by StageCraft
]

args = [
    "--/renderer/mdl/searchPaths/templates=${lightspeed.trex.app.resources}/deps/omni_core_materials/Base;${kit}/mdl/core/Base;${kit}/mdl/core/Volume;${kit}/mdl/core/mdl",
    # Match lightspeed.app.trex.base.kit viewport-window startup settings; standalone
    # extension tests bypass that app file and would otherwise spawn Kit's stock viewport UI.
    "--/exts/omni.kit.viewport.window/startup/cameraManipulator/enabled=false",
    "--/exts/omni.kit.viewport.window/startup/disableWindowOnLoad=true",
    "--/exts/omni.kit.viewport.window/startup/showOnLaunch=false",
    "--/exts/omni.kit.viewport.window/windowMenu/entryCount=0",
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.scene_view.opengl] No UsdRender.Product was found at *",
    "*[omni.usd] Stage opening or closing already in progress!*",
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = [
    "lightspeed.trex.tests.dependencies",
]

args = [
    "--/renderer/mdl/searchPaths/templates=${lightspeed.trex.app.resources}/deps/omni_core_materials/Base;${kit}/mdl/core/Base;${kit}/mdl/core/Volume;${kit}/mdl/core/mdl"
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.scene_view.opengl] No UsdRender.Product was found at *",
    "*[omni.usd] Stage opening or closing already in progress!*",
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]
