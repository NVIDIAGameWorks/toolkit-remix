[package]
kit_sdk_version = "110.*"
authors = ["#xoxor4d <45299104+xoxor4d@users.noreply.github.com>"]
title = "NVIDIA RTX Remix Alpha Cutout Window"
description = "Dockable window that converts alpha-tested capture meshes into cut replacement geometry"
version = "1.0.0"
readme = "docs/README.md"
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/-/tree/main/source/extensions/lightspeed.trex.alpha_cutout.widget"
category = "internal"
keywords = ["remix", "alpha", "cutout", "mesh"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"lightspeed.common" = {}
"lightspeed.events_manager" = {}
"lightspeed.trex.alpha_cutout.core" = {}
"lightspeed.trex.contexts" = {}
"lightspeed.trex.utils.widget" = {}
"omni.flux.utils.common" = {}
"omni.flux.utils.dialog" = {}
"omni.flux.utils.widget" = {}
"omni.ui" = {}
"omni.usd" = {}

[settings.persistent.exts."lightspeed.trex.alpha_cutout.widget"]
output_folder = ""
alpha_threshold = 128
trace_resolution = 256
simplify_tolerance = 1.0
edge_margin = 1.0
min_island_area = 4.0
disable_alpha_test = true
minimal_outline = true
thicken = false
thickness = 1.0
thicken_back_face = true
thicken_anti_stretch = false
smooth_normals = false
smoothing = 1.0
up_normals = false
up_amount = 1.0

[[python.module]]
name = "lightspeed.trex.alpha_cutout.widget"

[[test]]
dependencies = [
    "lightspeed.trex.tests.dependencies",
]

args = [
    "--/exts/omni.flux.utils.widget/default_resources_ext='lightspeed.trex.app.resources'",
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = [
    "lightspeed.trex.tests.dependencies",
]
