[core]
reloadable = false

[package]
kit_sdk_version = "110.*"
version = "0.2.4"
authors = ["Emanuel Kozerski <ekozerski@nvidia.com>"]
title = "Remix USD Schema Loader Extension"
description="Extension responsible for loading our custom USD schemas such as `RemixParticleSystem`."
readme  = "docs/README.md"
repository="https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/-/tree/main/source/extensions/lightspeed.trex.schemas"
category = "internal"
keywords = ["kit", "lightspeed", "schema", "usd", "particle", "system"]
changelog="docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.usd.libs" = {}
"lightspeed.common" = {}

# RemixParticleSystem.dll depends on USD DLLs from the HDRemix package root.
# Native libraries load before Python startup, so configure PATH here.
[[env]]
name = "PATH"
value = "${lightspeed.trex.schemas}/deps/hdremix"
isPath = true
append = true
override = false

[[env]]
name = "PATH"
value = "${lightspeed.trex.schemas}/deps/hdremix/usd/plugins/RemixParticleSystem"
isPath = true
append = true
override = false

[[python.module]]
name = "lightspeed.trex.schemas"

[[native.library]]
"filter:platform"."windows-x86_64"."path" = "usd/plugins/RemixParticleSystem/${lib_prefix}RemixParticleSystem${lib_ext}"

[[test]]
pyCoverageEnabled = true
